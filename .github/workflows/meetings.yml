# Every 2 hours: pick up new meetings and agendas, summarise meetings that have finished (video -> transcript ->
# plain-language summary and votes), check votes against the official minutes, then commit. The commit to main
# deploys the site. Needs the ANTHROPIC_API_KEY repository secret.
name: Council meetings
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      meeting:
        description: 'Re-summarise one meeting id (e.g. 2026-11-17-regular). Leave empty for the normal run.'
        required: false
concurrency:
  group: meetings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg poppler-utils
          pip install -q --upgrade yt-dlp faster-whisper 'av<16'  # av 16+ dropped an open() option faster-whisper 1.2 uses
          npm ci --no-audit --no-fund
      - name: Calendar and agendas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/pipeline/sync.mjs
      - name: Summarise finished meetings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/pipeline/summarize.mjs ${{ github.event.inputs.meeting }}
      - name: Check votes against the minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/pipeline/minutes.mjs
      - name: Make sure the site still builds
        run: node build.mjs
      - name: Commit
        run: |
          git config user.name 'squamish-voters-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/meetings data/promises.json public/transcripts
          if git diff --cached --quiet; then echo 'Nothing new'; exit 0; fi
          git commit -m "Meetings update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
