# Every 2 hours: pick up new meetings and agendas, check votes against the official minutes, and summarise from
# the minutes any meeting that hasn't been summarised from video yet. YouTube blocks cloud servers, so the video
# summaries come from Jeff's Mac (scripts/pipeline/mac/run.sh). The commit to main deploys the site through Vercel.
# Needs the ANTHROPIC_API_KEY repository secret.
name: Council meetings
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      meeting:
        description: 'Re-summarise one meeting id (e.g. 2026-11-17-regular). Leave empty for the normal run.'
        required: false
concurrency:
  group: meetings
  cancel-in-progress: false
permissions:
  contents: write
  actions: write # to start the IndexNow job after a push (pushes made here don't start other workflows)
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm ci --no-audit --no-fund
      - name: Calendar and agendas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/pipeline/sync.mjs
      - name: Check votes against the minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/pipeline/minutes.mjs
      - name: Summarise meetings the Mac missed, from their minutes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKIP_VIDEO: '1'
        run: node scripts/pipeline/summarize.mjs ${{ github.event.inputs.meeting }}
      - name: Share pictures for new summaries
        run: node scripts/pipeline/share.mjs
      - name: Make sure the site still builds
        run: node build.mjs
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'squamish-voters-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/meetings data/promises.json public/transcripts public/share
          if git diff --cached --quiet; then echo 'Nothing new'; exit 0; fi
          git commit -m "Meetings update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
          # Publish. Works once Vercel's GitHub app can see this repo; until then Jeff's Mac publishes (scripts/pipeline/mac/run.sh).
          curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || true
          gh workflow run indexnow.yml > /dev/null 2>&1 || true # tell Bing about the changed pages once live
      - name: Alarm if a meeting is not covered by the next afternoon
        # A meeting that ended more than 20 hours ago with no summary means something is broken (Nov 2026: the Mac bot
        # was stuck and the inaugural video was not linked in CivicWeb). Failing this step makes GitHub email Jeff.
        run: |
          node -e "
          const fs=require('fs'),p='data/meetings';const late=[];
          for(const f of fs.readdirSync(p).filter(x=>x.endsWith('.json'))){const m=JSON.parse(fs.readFileSync(p+'/'+f));
            if(m.summary||m.closed_only||m.status==='cancelled')continue;
            const end=Date.parse(m.date+'T'+(m.time||'18:00')+':00-08:00')+4*3600e3, age=(Date.now()-end)/3600e3;
            if(age>20&&age<24*14)late.push(m.id+' ('+Math.round(age)+' h)');}
          if(late.length){console.log('::error::No summary yet for: '+late.join(', ')+'. Check the Mac bot log and the District YouTube channel.');process.exit(1);}
          console.log('Every recent meeting is covered');"
