# The Friday email (full weekly roundup), 7 a.m. Pacific (8 a.m. in summer). Emails Jeff an Approve link;
# nothing goes to readers until he presses it (api/digest-review.js).
# GitHub's timer often fires hours late or not at all (6 h late Nov 13, 7 h Nov 20, nothing by 11 a.m. Nov 27 2026),
# so the news job (news.yml, always running) also starts this one on Friday from 15:00 UTC if it hasn't run yet.
# A late timer run after that skips itself, so Jeff never gets two approval emails for one week.
name: Weekly email
on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      html:
        description: 'Hand-written email file in emails/ (leave empty for the usual weekly email)'
        required: false
      subject:
        description: 'Subject line for the hand-written email'
        required: false
permissions:
  contents: read
  actions: read # to see whether this week's draft already started
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build and send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_ANALYTICS_TOKEN: ${{ secrets.VERCEL_ANALYTICS_TOKEN }}
          HTML_FILE: ${{ inputs.html }}
          SUBJECT: ${{ inputs.subject }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list --workflow digest.yml --created ">=$since" --json databaseId,conclusion --jq '[.[] | select(.databaseId != ${{ github.run_id }} and .conclusion != "failure")] | length' || echo 0)
            if [ "$n" != 0 ]; then echo "This week's draft already started ($n run(s) since $since); skipping the late timer run"; exit 0; fi
          fi
          node scripts/pipeline/confirm-pending.mjs || echo 'Confirm emails had a problem; carrying on with the weekly email'
          if [ -n "$HTML_FILE" ]; then
            node scripts/pipeline/digest.mjs --request --html "emails/$HTML_FILE" --subject "$SUBJECT"
          else
            node scripts/pipeline/digest.mjs --request
          fi
