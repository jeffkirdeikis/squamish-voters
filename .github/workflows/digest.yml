# The Friday email (full weekly roundup), 7 a.m. Pacific (8 a.m. in summer). Emails Jeff an Approve link;
# nothing goes to readers until he presses it (api/digest-review.js).
name: Weekly email
on:
  schedule:
    - cron: '0 15 * * 5'
  workflow_dispatch:
    inputs:
      html:
        description: 'Hand-written email file in emails/ (leave empty for the usual weekly email)'
        required: false
      subject:
        description: 'Subject line for the hand-written email'
        required: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Build and send
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HTML_FILE: ${{ inputs.html }}
          SUBJECT: ${{ inputs.subject }}
        run: |
          node scripts/pipeline/confirm-pending.mjs
          if [ -n "$HTML_FILE" ]; then
            node scripts/pipeline/digest.mjs --request --html "emails/$HTML_FILE" --subject "$SUBJECT"
          else
            node scripts/pipeline/digest.mjs --request
          fi
